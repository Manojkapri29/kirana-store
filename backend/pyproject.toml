# Tooling configuration only. Dependencies live in requirements*.txt.

[project]
name = "kirana-store-backend"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Migrations embed long SQL expressions (CHECK constraints) that cannot be wrapped.
"migrations/versions/*" = ["E501"]
# Tests favour readable one-line assertions and long descriptive names.
"tests/*" = ["E501"]
# The AI modules hold many one-sentence answer templates and regular expressions that read best unbroken.
"app/services/ai_*.py" = ["E501"]
"app/services/document_intelligence_service.py" = ["E501"]
# Phase 11 modules: long one-sentence safe messages, docstrings that explain a safeguard, and explanatory comments.
"app/api/admin_deps.py" = ["E501"]
"app/api/routes/health.py" = ["E501"]
"app/api/v1/account.py" = ["E501"]
"app/api/v1/admin.py" = ["E501"]
"app/admin_cli.py" = ["E501"]
"app/backup_cli.py" = ["E501"]
