"app/core/ratelimit.py" = ["E501"]
"app/core/schema_state.py" = ["E501"]
"app/models/notifications.py" = ["E501"]
"app/models/operations.py" = ["E501"]
"app/reporting/*.py" = ["E501"]
"app/schemas/admin.py" = ["E501"]
"app/services/account_service.py" = ["E501"]
"app/services/admin_service.py" = ["E501"]
"app/services/alert_service.py" = ["E501"]
