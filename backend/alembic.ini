# Alembic configuration. The database URL is NOT set here: migrations/env.py reads it from
# KIRANA_DATABASE_URL (see app/core/config.py), so migrations and the app always use the same setting.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revision files are named like 0001_initial_schema.py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
