# Serves the built app and forwards the API. TLS is terminated IN FRONT of this (a reverse proxy or load balancer):
# this container speaks plain HTTP on 8080 and trusts X-Forwarded-Proto from that proxy only.
upstream backend {
    server backend:8000;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Request size: photos are the largest thing sent (the backend limits them too).
    client_max_body_size 12m;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/snippets/security-headers.conf;

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    location /health {
        proxy_pass http://backend;
    }

    # Fingerprinted build files never change under the same name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: any other path is the app (never cached, so a new release is picked up).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
    }
}
